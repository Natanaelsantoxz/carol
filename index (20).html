<script id="code">

const SB_URL='COLE_AQUI_A_URL_DO_SUPABASE', SB_KEY='COLE_AQUI_A_CHAVE_ANON';
const SBOK=!SB_URL.startsWith('COLE');
/* PROTÓTIPO: enquanto o Supabase não estiver configurado, a área da profissional abre só com esta senha. */

let TOKEN=null, RT=null; try{ TOKEN=localStorage.getItem('sbtok'); RT=localStorage.getItem('sbrt'); }catch(e){}
function setSession(j){ TOKEN=(j&&j.access_token)||null; RT=(j&&j.refresh_token)||null;
  try{ TOKEN?localStorage.setItem('sbtok',TOKEN):localStorage.removeItem('sbtok'); RT?localStorage.setItem('sbrt',RT):localStorage.removeItem('sbrt'); }catch(e){} }
const authFetch=(q,body)=>fetch(SB_URL+'/auth/v1/token?grant_type='+q,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
async function refreshSession(){ if(!RT) return false; try{ const r=await authFetch('refresh_token',{refresh_token:RT}); if(!r.ok){ setSession(null); return false; } setSession(await r.json()); return true; }catch(e){ return false; } }
async function login(email,pw){ const r=await authFetch('password',{email,password:pw}); if(!r.ok) return false; setSession(await r.json()); return true; }
async function sb(method,path,body,auth,extra,retried){
  const r=await fetch(SB_URL+path,{method,headers:Object.assign({apikey:SB_KEY,'Content-Type':'application/json',Authorization:'Bearer '+((auth&&TOKEN)||SB_KEY)},extra||{}),body:body==null?undefined:JSON.stringify(body)});
  if(r.status===401&&auth&&!retried&&await refreshSession()) return sb(method,path,body,auth,extra,true);
  if(!r.ok) throw new Error('sb '+r.status);
  const t=await r.text(); return t?JSON.parse(t):null;

const mkDB=()=>({
  collection:()=>({

    async add(doc){ const r=await sb('POST','/rest/v1/bookings',doc,true,{Prefer:'return=representation'}); loadBK().catch(()=>{}); return {id:r[0].id}; } }),
  doc:p=>{ const id=p.split('/')[1]; return {

/* PROTÓTIPO: banco de demonstração guardado no próprio navegador (localStorage). Só é usado sem Supabase. */

const demoFire=()=>{ demoLoad(); const docs=DEMO.map(r=>({id:r.id,data:()=>r})); BKL.forEach(f=>f(docs)); };

const demoDB=()=>{ demoLoad();

const clientNum=n=>{const d=digits(n);return d.length<=11?'55'+d:d;};
const money=n=>(n==null||n===''||isNaN(n))?'':'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:Number.isInteger(+n)?0:2,maximumFractionDigits:2});
const durTxt=m=>{m=+m||0; if(!m) return ''; const h=Math.floor(m/60), r=m%60; return h?(r?h+'h'+pad(r):h+'h'):m+' min';};
const baseDur=()=>Math.max(15,+S.duration||60);
const svcMin=s=>s.min||baseDur();
const SAMPLE={nome:'Mariana Souza',servico:'Coloração',data:'Quarta-feira, 04 de novembro',hora:'14:00',whatsapp:'(11) 98877-6655',valor:'R$ 180'};

function blockedSet(s){
  const set=new Set();
  String(s.blocked||'').split(/[\n,;]+/).forEach(l=>{const m=l.trim().match(/^(\d{1,2})\/(\d{1,2})/); if(m) set.add(pad(+m[1])+'/'+pad(+m[2]));});
  return set;
}
function isOpen(d){return S.days.includes(d.getDay()) && !blockedSet(S).has(pad(d.getDate())+'/'+pad(d.getMonth()+1));}
// horários livres do dia; "need" = minutos que os serviços escolhidos ocupam; "busy" = horários já tomados (sem dados pessoais)
function slotsFor(d,need){
  const [sh,sm]=String(S.start).split(':').map(Number),[eh,em]=String(S.end).split(':').map(Number);
  const dur=baseDur(); need=Math.max(15,need||dur); let t=sh*60+sm; const end=eh*60+em, out=[];
  const now=new Date(), today=d.toDateString()===now.toDateString(), nowMin=now.getHours()*60+now.getMinutes();
  const bz=(S.busy||[]).filter(b=>b.d===iso(d)).map(b=>{const [h,m]=String(b.t).split(':').map(Number); const a=h*60+m; return [a,a+(+b.m||dur)];});
  while(t+need<=end){ if((!today||t>nowMin)&&!bz.some(([a,b])=>t<b&&t+need>a)) out.push(pad(Math.floor(t/60))+':'+pad(t%60)); t+=dur; }
  return out;
}

function paintDays(){
  const days=$('#days'); if(!days) return; const keep=sel.day?sel.day.toDateString():null; days.innerHTML='';
  const now=new Date(); now.setHours(0,0,0,0); let kept=false;
  for(let i=0;i<14;i++){
    const d=new Date(now); d.setDate(now.getDate()+i);
    const n=isOpen(d)?slotsFor(d,needMin()).length:0, open=n>0, pressed=open&&keep===d.toDateString(); if(pressed) kept=true;
    const b=document.createElement('button'); b.type='button'; b.className='day'; b.disabled=!open; b.setAttribute('aria-pressed',pressed);
    b.innerHTML=`<small>${WDS[d.getDay()]}</small><b>${d.getDate()}</b><i>${open?n+' livres':'fechado'}</i>`;
    b._d=d; days.appendChild(b);
  }
  if(!kept){sel.day=null;sel.time=null;}
  paintSlots();
}
function paintSlots(){
  if(!sel.day){$('#timePanel').hidden=true; $('#dataPanel').hidden=true; return;}
  const list=slotsFor(sel.day,needMin()); if(!list.includes(sel.time)) sel.time=null;
  $('#timePanel').hidden=false; $('#timeLbl').textContent=longDate(sel.day);
  $('#slots').innerHTML=list.map(t=>`<button class="slot" type="button" aria-pressed="${t===sel.time}" data-t="${t}">${t}</button>`).join('');
  $('#dataPanel').hidden=!sel.time;
}
function check(){const ok=sel.svc.length&&sel.day&&sel.time&&$('#cNome')&&$('#cNome').value.trim().length>2&&digits($('#cTel').value).length>=10; if($('#send')) $('#send').disabled=!ok;}
async function sendRequest(){
  const t=totals();

  try{ if(!SBOK){ demoLoad(); DEMO.unshift({id:'demo'+Date.now(),nome:v.nome,tel:v.whatsapp,servico:v.servico,valor:v.valor,data:v.data,iso:iso(sel.day),hora:v.hora,min:t.min,status:'pendente',criado:Date.now()}); demoSave(); demoFire(); } else await sb('POST','/rest/v1/bookings',{nome:v.nome,tel:v.whatsapp,servico:v.servico,valor:v.valor,data:v.data,iso:iso(sel.day),hora:v.hora,min:t.min,status:'pendente',criado:Date.now()},false,{Prefer:'return=minimal'}); }
  catch(e){ sb_.disabled=false; sb_.textContent='Enviar pedido'; alert('Não foi possível enviar o pedido agora. Tente de novo em instantes.'); return; }
  $('#app').innerHTML=brandHTML()+`<div class="panel sent"><h2>Pedido enviado ✨</h2>
    <p class="lead">A ${esc(first)} já recebeu seu pedido e vai confirmar pelo WhatsApp. Se quiser, avise por lá também.</p>

}

    const names=R.serv.value.split('+').map(s=>s.trim().toLowerCase()).filter(Boolean);
    const min=names.reduce((a,n)=>{const s=S.services.find(x=>x.nome.trim().toLowerCase()===n); return a+(s?svcMin(s):baseDur());},0)||baseDur();
    const h=R.hora.value.trim().split(':'); const doc={nome:R.nome.value.trim(),tel:R.tel.value.trim(),servico:R.serv.value.trim(),valor:R.valor.value.trim(),data:R.data.value.trim(),iso:parseDate(R.data.value),hora:pad(+h[0])+':'+h[1],min,status:'pendente',criado:Date.now()};
    try{ const ref=await DB.collection('bookings').add(doc); [R.paste,R.nome,R.tel,R.serv,R.data,R.hora,R.valor].forEach(i=>i.value='');
      await syncBusy([...BK.filter(b=>b.id!==ref.id),{id:ref.id,...doc}]);
    }catch(e){ $('#rHint').textContent='Não foi possível adicionar. Tente de novo.'; }
    formOk(); };
  $('#bkList').addEventListener('click',onBkClick);
  $('#bkList').addEventListener('input',e=>{ if(e.target.id==='freeMsg') msgDraft=e.target.value; });
  $('#save').onclick=save;
  refresh(); paintBookings();
}
function parseDate(txt){
  txt=String(txt||'').toLowerCase(); const now=new Date(); now.setHours(0,0,0,0); let day,mon;
  let m=txt.match(/(\d{1,2})\s*(?:de\s+)?([a-zç]+)/);
  if(m&&MO.indexOf(m[2])>=0){day=+m[1];mon=MO.indexOf(m[2]);}
  else if((m=txt.match(/(\d{1,2})\s*\/\s*(\d{1,2})/))){day=+m[1];mon=+m[2]-1;}
  else return '';
  if(day<1||day>31||mon<0||mon>11) return '';
  let d=new Date(now.getFullYear(),mon,day); if(d.getMonth()!==mon) return '';
  if(d<new Date(now.getTime()-2*864e5)) d=new Date(now.getFullYear()+1,mon,day);
  return iso(d);
}

/* ---------- pedidos (guardados no db, privados da profissional) ---------- */
let DB=null, BK=[], bkReady=false, bkErr='', dbStarted=false, openAct=null, openMsg=null, msgDraft='';
const STATUS_LBL={pendente:'Aguardando',confirmado:'Confirmado',recusado:'Recusado',cancelado:'Cancelado'};
const ACT={ok:{key:'confirmacao',st:'confirmado',txt:'Abrir WhatsApp e confirmar',cls:'ok'},no:{key:'recusa',st:'recusado',txt:'Abrir WhatsApp e recusar',cls:'bad'},cancel:{key:'cancelamento',st:'cancelado',txt:'Abrir WhatsApp e cancelar',cls:'bad'}};
const bkVars=b=>({nome:b.nome,servico:b.servico,data:b.data,hora:b.hora,whatsapp:b.tel,valor:b.valor});
const cmp=(a,b)=>String((a.iso||'')+(a.hora||'')).localeCompare(String((b.iso||'')+(b.hora||'')));

function bkCard(b,mode){
  const mbtn=`<button type="button" class="btn ghost sm" data-msg="${b.id}">Mensagem</button>`;
  const acts=mode==='pend'?`<button type="button" class="btn ok sm" data-act="ok" data-id="${b.id}">Confirmar</button><button type="button" class="btn bad sm" data-act="no" data-id="${b.id}">Recusar</button>${mbtn}`
    :mode==='conf'?`<button type="button" class="btn bad sm" data-act="cancel" data-id="${b.id}">Cancelar agendamento</button>${mbtn}`
    :`${mbtn}<button type="button" class="linkbtn" data-del="${b.id}">Excluir da lista</button>`;
  let panel='';
  if(openMsg===b.id) panel=`<div class="actpanel"><label class="field"><span>Mensagem para ${esc(b.nome)}</span><textarea id="freeMsg" rows="4" placeholder="Escreva sua mensagem">${esc(msgDraft)}</textarea></label>
      <button class="btn sm" type="button" data-sendmsg="${b.id}" style="width:100%">Enviar pelo WhatsApp</button>
      <p class="center" style="margin:8px 0 0"><button type="button" class="linkbtn" data-back="1">Fechar</button></p></div>`;
  else if(openAct&&openAct.id===b.id){const a=ACT[openAct.act], msg=fill(S.msgs[a.key],bkVars(b));
    panel=`<div class="actpanel"><p class="hint" style="margin:0 0 8px">Mensagem para ${esc(b.nome)}:</p><p class="bubble">${waFmt(msg)}</p>
      <a class="btn ${a.cls}" data-go="${openAct.act}" data-id="${b.id}" href="${esc(wa(clientNum(b.tel),msg))}" target="_blank" rel="noopener" style="margin-top:10px">${a.txt}</a>
      <p class="center" style="margin:8px 0 0"><button type="button" class="linkbtn" data-back="1">Voltar</button></p></div>`;}
  return `<div class="panel bk"><div class="bkh"><b>${esc(b.nome)}</b><span class="tag ${esc(b.status)}">${STATUS_LBL[b.status]||esc(b.status)}</span></div>
    <p class="bkm">${esc(b.data)} · <b>${esc(b.hora)}</b><br>${esc(b.servico)}${b.valor?' · '+esc(b.valor):''}<br><span class="tel">${esc(b.tel)}</span></p>
    ${panel?'':`<div class="acts">${acts}</div>`}${panel}</div>`;
}
function paintBookings(){
  const box=$('#bkList'); if(!box) return;
  if(!DB){ box.innerHTML=`<div class="panel"><p class="empty">${!SBOK?'Protótipo: os pedidos aparecerão aqui quando o banco de dados for conectado.':dbStarted?'Os pedidos precisam do login na sua conta. Abra o site pelo seu acesso.':'Carregando…'}</p></div>`; return; }
  if(!bkReady){ box.innerHTML=`<div class="panel"><p class="empty">${bkErr==='slow'?'Ainda não consegui carregar os pedidos. Confira a conexão.':bkErr==='err'?'Não foi possível carregar os pedidos.':'Carregando pedidos…'}</p></div>`; return; }
  const today=iso(new Date());
  const pend=BK.filter(b=>b.status==='pendente').sort(cmp);
  const conf=BK.filter(b=>b.status==='confirmado'&&(b.iso||'9')>=today).sort(cmp);
  const hist=BK.filter(b=>b.status!=='pendente'&&!(b.status==='confirmado'&&(b.iso||'9')>=today)).sort((a,b)=>cmp(b,a)).slice(0,12);
  const sec=(t,list,mode,empty)=>`<h3 class="lbl" style="margin-top:6px">${t}${list.length?' ('+list.length+')':''}</h3>${list.length?list.map(b=>bkCard(b,mode)).join(''):`<p class="empty" style="margin:0 0 14px">${empty}</p>`}`;
  box.innerHTML=sec('Aguardando confirmação',pend,'pend','Nenhum pedido aguardando.')+sec('Confirmados',conf,'conf','Nenhum horário confirmado.')+(hist.length?sec('Histórico',hist,'hist',''):'');
}
async function onBkClick(e){
  const act=e.target.closest('[data-act]'), back=e.target.closest('[data-back]'), del=e.target.closest('[data-del]'), go=e.target.closest('[data-go]');
  if(go){ // o link do WhatsApp abre sozinho; aqui só registramos o novo estado
    const id=go.dataset.id, st=ACT[go.dataset.go].st, b=BK.find(x=>x.id===id); if(!b||!DB) return; openAct=null;
    try{ await DB.doc('bookings/'+id).update({status:st,atualizado:Date.now()}); await syncBusy(BK.map(x=>x.id===id?{...x,status:st}:x)); }
    catch(err){ setStatus('A mensagem foi aberta, mas não consegui atualizar o pedido. Tente de novo.','err'); }
    return; }
  const msgBtn=e.target.closest('[data-msg]'), sendMsg=e.target.closest('[data-sendmsg]');
  if(act){ // um toque: abre o WhatsApp da cliente já com a mensagem e atualiza o pedido; a área da profissional continua aberta aqui
    const id=act.dataset.id, key=act.dataset.act, a=ACT[key], b=BK.find(x=>x.id===id); if(!b||!DB) return;
    const w=window.open(wa(clientNum(b.tel),fill(S.msgs[a.key],bkVars(b))),'_blank');
    if(!w){ openAct={id,act:key}; openMsg=null; paintBookings(); return; } // pop-up bloqueado: mostra o botão manual
    try{ w.opener=null; }catch(err){}
    openAct=null; openMsg=null;
    try{ await DB.doc('bookings/'+id).update({status:a.st,atualizado:Date.now()}); await syncBusy(BK.map(x=>x.id===id?{...x,status:a.st}:x));
      setStatus(({ok:'Confirmado',no:'Recusado',cancel:'Cancelado'})[key]+'. WhatsApp aberto para '+b.nome+'.','good'); }
    catch(err){ setStatus('O WhatsApp abriu, mas não consegui atualizar o pedido. Tente de novo.','err'); }
    return; }
  if(msgBtn){ openMsg=msgBtn.dataset.msg; openAct=null; msgDraft=''; paintBookings(); const t=$('#freeMsg'); if(t) t.focus(); }
  else if(sendMsg){ const b=BK.find(x=>x.id===sendMsg.dataset.sendmsg); if(!b) return;
    const w=window.open(wa(clientNum(b.tel),msgDraft.trim()),'_blank'); if(w){ try{ w.opener=null; }catch(err){} }
    openMsg=null; msgDraft=''; paintBookings(); setStatus('WhatsApp aberto para '+b.nome+'.','good'); }
  else if(back){ openAct=null; openMsg=null; msgDraft=''; paintBookings(); }
  else if(del&&DB){ try{ await DB.doc('bookings/'+del.dataset.del).delete(); }catch(err){ setStatus('Não foi possível excluir.','err'); } }
}
// o site público só recebe horários ocupados (sem nome nem telefone) e fecha esses horários para as clientes
async function syncBusy(){}
async function startDb(){
  if(dbStarted) return; dbStarted=true;
  DB=!SBOK?demoDB():(TOKEN?mkDB():null);
  if(!DB){ paintBookings(); const a=$('#rAdd'); if(a) a.disabled=true; return; }
  const timer=setTimeout(()=>{ if(!bkReady){ bkErr='slow'; paintBookings(); } },10000);
  DB.collection('bookings').onSnapshot(s=>{ BK=s.docs.map(d=>({id:d.id,...d.data()})); bkReady=true; bkErr=''; clearTimeout(timer); paintBookings(); },
    ()=>{ bkErr='err'; clearTimeout(timer); paintBookings(); });
}

async function save(){
  const btn=$('#save'); if(btn) btn.disabled=true; setStatus('Salvando…','');
  if(!SBOK){ SAVED=JSON.parse(JSON.stringify(S)); setStatus('Protótipo: salvo só enquanto esta página estiver aberta.','good'); if(btn) btn.disabled=false; return; }
  try{ const rest=Object.assign({},S); delete rest.busy;
    await sb('POST','/rest/v1/settings?on_conflict=id',{id:1,data:rest},true,{Prefer:'resolution=merge-duplicates,return=minimal'});
    SAVED=JSON.parse(JSON.stringify(S)); setStatus('Publicado ✓','good'); }
  catch(e){ setStatus('Não foi possível salvar. Saia e entre de novo na área da profissional.','err'); }
  if(btn) btn.disabled=false;
}
